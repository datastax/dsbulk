name: Nightly Build

on:
  schedule:
    # Run Monday-Friday at 6:00 AM UTC (matching Jenkins schedule)
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      generate_artifacts:
        description: 'Generate distribution artifacts'
        required: false
        default: true
        type: boolean

jobs:
  full-matrix-test:
    name: Full Matrix - Cassandra ${{ matrix.cassandra-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cassandra-version: ['3.11', '4.0', '4.1', '5.0']
      fail-fast: false
    
    services:
      cassandra:
        image: cassandra:${{ matrix.cassandra-version }}
        ports:
          - 9042:9042
        env:
          CASSANDRA_CLUSTER_NAME: test-cluster
          CASSANDRA_DC: datacenter1
          CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
        options: >-
          --health-cmd "cqlsh -e 'describe cluster'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Wait for Cassandra
        run: |
          echo "Waiting for Cassandra to be ready..."
          for i in {1..30}; do
            if docker exec $(docker ps -q -f ancestor=cassandra:${{ matrix.cassandra-version }}) cqlsh -e "describe cluster" > /dev/null 2>&1; then
              echo "Cassandra is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done
      
      - name: Build and test with all profiles
        run: |
          mvn clean verify -Pmedium -Plong -B -V \
            -Dmaven.test.failure.ignore=true \
            -Dmax.simulacron.clusters=2 \
            -Dmax.ccm.clusters=1
        env:
          CASSANDRA_VERSION: ${{ matrix.cassandra-version }}
      
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          check_name: Nightly Test Results (Cassandra ${{ matrix.cassandra-version }})
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-test-results-cassandra-${{ matrix.cassandra-version }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 14

  full-matrix-dse:
    name: Full Matrix - DSE ${{ matrix.dse-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dse-version: ['5.1.48', '6.8.61', '6.9.17']
      fail-fast: false
    
    services:
      dse:
        image: datastax/dse-server:${{ matrix.dse-version }}
        ports:
          - 9042:9042
        env:
          DS_LICENSE: accept
          CLUSTER_NAME: test-cluster
          DC: datacenter1
        options: >-
          --health-cmd "cqlsh -e 'describe cluster'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Wait for DSE
        run: |
          echo "Waiting for DSE to be ready..."
          for i in {1..30}; do
            if docker exec $(docker ps -q -f ancestor=datastax/dse-server:${{ matrix.dse-version }}) cqlsh -e "describe cluster" > /dev/null 2>&1; then
              echo "DSE is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done
      
      - name: Build and test with all profiles
        run: |
          mvn clean verify -Pmedium -Plong -B -V \
            -Dmaven.test.failure.ignore=true \
            -Dmax.simulacron.clusters=2 \
            -Dmax.ccm.clusters=1
        env:
          DSE_VERSION: ${{ matrix.dse-version }}
      
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          check_name: Nightly Test Results (DSE ${{ matrix.dse-version }})
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-test-results-dse-${{ matrix.dse-version }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 14

  generate-artifacts:
    name: Generate Distribution Artifacts
    runs-on: ubuntu-latest
    needs: [full-matrix-test, full-matrix-dse]
    if: |
      always() && 
      (github.event_name == 'schedule' || 
       (github.event_name == 'workflow_dispatch' && github.event.inputs.generate_artifacts == 'true'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with release profile
        run: |
          mvn clean verify -Prelease -Dgpg.skip=true -B -V \
            -Dmaven.test.failure.ignore=false
      
      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dsbulk-nightly-${{ github.run_number }}
          path: |
            distribution/target/dsbulk-*.tar.gz
            distribution/target/dsbulk-*.zip
            distribution/target/dsbulk-*.jar
          retention-days: 30

  notify-results:
    name: Notify Build Results
    runs-on: ubuntu-latest
    needs: [full-matrix-test, full-matrix-dse, generate-artifacts]
    if: always()
    
    steps:
      - name: Check build status
        id: check_status
        run: |
          if [ "${{ needs.full-matrix-test.result }}" = "success" ] && \
             [ "${{ needs.full-matrix-dse.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ Nightly build passed" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Nightly build failed" >> $GITHUB_OUTPUT
          fi
      
      - name: Create summary
        run: |
          echo "## Nightly Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ steps.check_status.outputs.message }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run**: [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Cassandra Tests: ${{ needs.full-matrix-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- DSE Tests: ${{ needs.full-matrix-dse.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts: ${{ needs.generate-artifacts.result }}" >> $GITHUB_STEP_SUMMARY
      
      # Optional: Add Slack notification here if SLACK_WEBHOOK_URL secret is configured
      # - name: Notify Slack
      #   if: env.SLACK_WEBHOOK_URL != ''
